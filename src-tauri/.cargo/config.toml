# Статическая линковка C++ runtime.
#
# Rust на Windows по умолчанию линкуется с CRT динамически, и на чистой системе
# без Microsoft Visual C++ Redistributable программа не стартует вовсе —
# «не обнаружена VCRUNTIME140.dll». Для portable-программы, которую переносят
# флешкой и запускают на чужой машине, это неприемлемо: установщика у нас нет
# и просить поставить runtime некому.
#
# Конфиг ищется от текущего каталога вверх, поэтому он действует при сборке
# из `src-tauri` — так, как описано в CLAUDE.md. Если однажды начнём звать
# cargo из корня репозитория через `--manifest-path`, файл придётся продублировать
# (или перенести) в корень: оттуда этот не виден.

[target.'cfg(target_env = "msvc")']
rustflags = ["-C", "target-feature=+crt-static"]
