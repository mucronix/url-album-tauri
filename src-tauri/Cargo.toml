[package]
name = "url-album"
version = "2.3.2-beta"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio       = { version = "1", features = ["time"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
encoding_rs = "0.8"
rfd         = "0.15"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny_http   = "0.12"
getrandom   = "0.2"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
strip         = true
