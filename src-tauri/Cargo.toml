[package]
name = "url-album"
version = "2.3.4-beta"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["mucronix"]
repository = "https://github.com/mucronix/url-album-tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["protocol-asset", "tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio       = { version = "1", features = ["time"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
encoding_rs = "0.8"
rfd         = "0.15"
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tiny_http   = "0.12"
getrandom   = "0.2"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
strip         = true

# Только ветка win7-probe. ctor 0.8.0 и dtor 0.3.0 узнают Windows по
# target_vendor = "pc", а у x86_64-win7-windows-msvc vendor = "win7" —
# compile_error! в tauri-utils. Копии отличаются одной заменой условия
# на any(target_vendor = "pc", target_vendor = "win7").
[patch.crates-io]
ctor = { path = "win7-patches/ctor" }
dtor = { path = "win7-patches/dtor" }
